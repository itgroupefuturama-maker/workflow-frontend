<!doctype html>
<html lang="fr" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Al Bouraq Travel : outils de gestion des prestations, dossiers et clients." />
    <meta name="theme-color" content="#1e293b" />
    <style>html,body{margin:0;background:#f1f5f9}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al Bouraq Travel</title>
  </head>
  <body>
    <div id="root">
      <!-- Écran de démarrage statique : visible pendant le téléchargement du JavaScript,
           remplacé automatiquement par React (même rendu que src/components/AppSplash.tsx). -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f1f5f9;font-family:ui-sans-serif,system-ui,sans-serif;opacity:0;animation:boot-in .2s ease-out .15s forwards">
        <img src="/apple-touch-icon.png" alt="" width="56" height="56" style="border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.08)" />
        <p style="margin-top:16px;font-size:14px;font-weight:600;letter-spacing:.02em;color:#334155">Al Bouraq Travel</p>
        <div style="margin-top:20px;width:160px;height:4px;border-radius:9999px;background:#e2e8f0;overflow:hidden">
          <div style="width:33%;height:100%;border-radius:9999px;background:#6366f1;animation:boot-bar 1.1s ease-in-out infinite"></div>
        </div>
      </div>
      <style>
        @keyframes boot-in { to { opacity: 1 } }
        @keyframes boot-bar { 0% { transform: translateX(-100%) } 100% { transform: translateX(300%) } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
